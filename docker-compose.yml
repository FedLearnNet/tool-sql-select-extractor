services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TEST_MODE: "true"
      PYTHONUNBUFFERED: "1"
  postgres:
    image: postgres:16
    container_name: sqlselect_postgres
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U demo -d demo" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_data:
